name: Actualizar datos del SECOP

# Semanal + manual. Al commitear public/data, Vercel redespliega solo.
on:
  schedule:
    - cron: "0 9 * * 1"      # lunes 09:00 UTC (04:00 en Colombia)
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar contratos de SECOP II
        env:
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
        run: python3 scripts/fetch_data.py

      # SECOP I es un sistema cerrado (2015-2022): no cambia, pero se re-descarga
      # por si hay correcciones retroactivas. La consulta es lenta.
      - name: Descargar contratos de SECOP I
        env:
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
        run: python3 scripts/fetch_secop1.py
        continue-on-error: true

      # El contorno de la isla no cambia: se regenera solo a mano (scripts/fetch_geo.py)
      # para no golpear Overpass cada semana.
      - name: Reconstruir los JSON de la web
        run: python3 scripts/build_data.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización automática del SECOP"
            git push
          fi
